[project]
name = "voice-assistant"
version = "0.1.0"
description = "Windows voice assistant prototype: local streaming speech, streamed text, chunked TTS, permissioned tasks"
requires-python = ">=3.10"
dependencies = [
  "PySide6", "sherpa-onnx", "sounddevice", "numpy", "keyboard", "httpx", "sentencepiece", "psutil", "ddgs", "keyring", "mcp>=2", "pypdf", "mss", "pycaw", "ytmusicapi", "websockets",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
